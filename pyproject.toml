[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-agent-demo"
version = "0.1.0"
description = "Two-agent natural-language to PostgreSQL workflow"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "pandas",
    "pg8000",
    "pydantic",
    "python-dotenv",
    "scikit-learn",
    "sqlglot",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["sql_agent*"]
